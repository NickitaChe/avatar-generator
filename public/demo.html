<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Avatar Generator Demo</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}
    body{margin:0;background:#0b0d10;color:#f4f4f4;padding:24px}
    h1{margin:0 0 8px}.muted{color:#9ca3af;margin-bottom:24px}
    .grid{display:grid;gap:28px}
    .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:16px;border:1px solid #23272f;border-radius:16px;background:#11151a}
    .item{display:grid;gap:6px;justify-items:center}
    canvas{background:#050608;border-radius:14%;box-shadow:0 0 0 1px #222}
    code{font-size:12px;color:#9ca3af}
  </style>
</head>
<body>
  <h1>Avatar Generator</h1>
  <div class="muted">8 deterministic icons × 512 / 256 / 128 / 64 / 32</div>
  <div id="app" class="grid"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
