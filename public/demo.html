<!doctype html><html><head><meta charset="utf-8"><title>Avatar Generator</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#0b0d10;color:#f4f4f4;padding:24px}h1,h2{margin:0 0 8px}.muted{color:#9ca3af;margin-bottom:24px}.grid{display:grid;gap:28px}.row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:16px;border:1px solid #23272f;border-radius:16px;background:#11151a}.item{display:grid;gap:6px;justify-items:center}canvas{background:#050608;border-radius:14%;box-shadow:0 0 0 1px #222}code{font-size:12px;color:#9ca3af}.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin:12px 0 32px}.asset{background:#11151a;border:1px solid #23272f;border-radius:10px;padding:8px;text-align:center}.asset img{width:100%;aspect-ratio:1;display:block}.asset code{display:block;margin-top:5px;overflow-wrap:anywhere}.palette-section{margin:0 0 30px}.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.palette-card{background:#11151a;border:1px solid #23272f;border-radius:12px;padding:10px}.palette-card canvas{width:100%;height:auto}.swatches{display:grid;grid-template-columns:repeat(4,1fr);height:12px;border-radius:5px;overflow:hidden;margin-top:8px}.palette-meta{display:block;margin-top:7px;line-height:1.45}
</style></head><body><h1>Avatar Generator</h1><div class=muted>8 deterministic avatars × 512 / 256 / 128 / 64 / 32</div><div id=app class=grid></div><h2 style="margin-top:40px">SVG catalog</h2><div class=muted>32 genuinely distinct source designs per layer.</div><div id=catalog></div><h2 style="margin-top:40px">Palette Lab</h2><div class=muted>Same geometry, different deterministic palette systems. Compare harmony, contrast and tone.</div><div id=palettes></div><script type=module src="/app.js"></script></body></html>
